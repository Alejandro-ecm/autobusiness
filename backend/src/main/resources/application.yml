spring:
  application:
    name: autobusiness-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autobusiness}
    username: ${SPRING_DATASOURCE_USERNAME:autobusiness}
    password: ${SPRING_DATASOURCE_PASSWORD:autobusiness_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  task:
    scheduling:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  # Resuelve la IP real del cliente de forma segura: Tomcat (RemoteIpValve)
  # solo confia en X-Forwarded-For/X-Real-IP cuando la conexion TCP directa
  # viene de una IP interna (rangos privados RFC1918 + loopback — el default
  # de Tomcat, sin sobreescribir server.tomcat.remoteip.internal-proxies).
  # Una peticion que llega directo desde internet con esos headers falsos NO
  # cambia request.getRemoteAddr() — el header simplemente se ignora. Esto es
  # cierto sin importar si la peticion pasa por un proxy intermedio o no:
  # quien conecta via TCP directo al contenedor siempre es el proxy interno
  # confiable, nunca el atacante.
  #
  # Topologia real de produccion (confirmada 2026-09-30): frontend en Vercel,
  # backend aqui en Railway — Vercel hace rewrite de /api/* hacia esta URL de
  # Railway (ver vercel.json en la raiz del repo), el navegador nunca llama
  # directo a Railway. El nginx de docker-compose.prod.yml/setup-server.sh es
  # una ruta de despliegue alterna (VPS self-hosted), no la que sirve el
  # dominio de produccion actual.
  #
  # PENDIENTE: no esta confirmado si el rango interno real que usa Railway
  # entre su borde publico y este contenedor cae dentro del default de Tomcat
  # (RFC1918+loopback) o si es otro rango (ej. CGNAT 100.64.0.0/10). No se
  # adivina aqui — usar GET /super-admin/diagnostics/request-info (SUPER_ADMIN,
  # con app.diagnostics-enabled=true temporalmente) desde dos redes reales
  # distintas para confirmarlo antes de, si hace falta, sobreescribir
  # server.tomcat.remoteip.internal-proxies con el rango real observado.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 25
      min-spare: 5

jwt:
  secret: ${JWT_SECRET:autobusiness_jwt_super_secret_key_2024_development}
  expiration: 86400000  # 24h en ms

ai:
  engine:
    url: ${AI_ENGINE_URL:http://localhost:8001}

whatsapp:
  service-url: ${WHATSAPP_SERVICE_URL:http://localhost:8002}
  internal-token: ${WA_INTERNAL_TOKEN:autobusiness_wa_internal_dev}

instagram:
  app-id: ${IG_APP_ID:}
  app-secret: ${IG_APP_SECRET:}
  verify-token: ${IG_VERIFY_TOKEN:autobusiness_ig_verify_dev}
  redirect-uri: ${IG_REDIRECT_URI:https://autobusiness-production-ccbc.up.railway.app/api/settings/instagram/oauth-callback}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:TEST-placeholder-change-me}
  public-key: ${MP_PUBLIC_KEY:}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  notification-url: ${MP_NOTIFICATION_URL:https://autobusiness-production-ccbc.up.railway.app/api/payments/mercadopago/webhook}
  success-url: ${MP_SUCCESS_URL:https://autobusiness.skytechnologieslatam.com/payment/success}
  failure-url: ${MP_FAILURE_URL:https://autobusiness.skytechnologieslatam.com/payment/failure}
  pending-url: ${MP_PENDING_URL:https://autobusiness.skytechnologieslatam.com/payment/pending}
  client-id: ${MP_CLIENT_ID:}
  client-secret: ${MP_CLIENT_SECRET:}
  oauth-redirect-uri: ${MP_OAUTH_REDIRECT_URI:https://autobusiness-production-ccbc.up.railway.app/api/settings/mp/oauth-callback}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:AutoBusiness AI <onboarding@resend.dev>}

# Par de llaves VAPID para Web Push. El default es solo para desarrollo local —
# en produccion, generar un par propio y configurarlo via env vars para que la
# llave privada no quede en el codigo fuente.
vapid:
  public-key: ${VAPID_PUBLIC_KEY:BHQd4Jgba15CulWEP48Rb5GYODeumFSWP98ZH3dcO4VjLRE8aY4-_jHxaEh4WI05Gq71eCTeJVn0I1OrInOViIw}
  private-key: ${VAPID_PRIVATE_KEY:6rxdQXencpdVzluBdjhZe-7e1S9MXMSwnhdOOgwp2us}
  subject: ${VAPID_SUBJECT:https://autobusiness.skytechnologieslatam.com}

account:
  deletion:
    # true = runScheduledDeletions() solo registra en el log que negocios
    # eliminaria (sin tocar nada). Default false: no cambia el comportamiento
    # ya activo en produccion. Util para verificar el job sin riesgo.
    dry-run: ${ACCOUNT_DELETION_DRY_RUN:false}

app:
  base-url: ${APP_BASE_URL:https://autobusiness.skytechnologieslatam.com}
  base-domain: ${APP_BASE_DOMAIN:autobusiness.skytechnologieslatam.com}
  # En producción: lista separada por comas con tu dominio real
  # Ejemplo: https://app.tudominio.com,https://tudominio.com
  allowed-origins: ${APP_ALLOWED_ORIGINS:https://autobusiness.skytechnologieslatam.com,https://app.skytechnologieslatam.com,https://skytechnologieslatam.com,http://localhost:3000,http://localhost:5173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: AutoBusiness AI
    version: 1.0.0
    description: Backend API — SaaS multitenant

logging:
  level:
    com.autobusiness: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.scheduling: INFO
