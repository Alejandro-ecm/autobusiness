server {
    listen 80;
    return 301 https://$host:3443$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # iOS profile install: serve cert with correct MIME type
    location = /autobusiness-ca.crt {
        types { }
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="autobusiness-ca.crt"';
    }

    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /ai-engine/ {
        proxy_pass       http://ai-engine:8001/;
        proxy_set_header Host $host;
        # Allow larger frames for image upload
        client_max_body_size 4m;
    }
}
